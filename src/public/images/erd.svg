<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420">
  <style>
    .box { fill:#f8fafc; stroke:#0f172a; stroke-width:2px; }
    .title { font: bold 20px sans-serif; fill:#0f172a; }
    .field { font: 16px sans-serif; fill:#1f2937; }
    .label { font: bold 18px sans-serif; fill:#0f172a; }
    .line { stroke:#0f172a; stroke-width:2px; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a" />
    </marker>
  </defs>

  <rect x="30" y="30" width="320" height="220" class="box" rx="14" ry="14" />
  <text x="50" y="60" class="title">final_projects</text>
  <text x="50" y="95" class="field">id PK</text>
  <text x="50" y="120" class="field">judul</text>
  <text x="50" y="145" class="field">deskripsi_singkat</text>
  <text x="50" y="170" class="field">analisis_masalah</text>
  <text x="50" y="195" class="field">fitur_utama</text>
  <text x="50" y="220" class="field">tech_stack</text>
  <text x="50" y="245" class="field">progress_status</text>

  <rect x="430" y="140" width="320" height="150" class="box" rx="14" ry="14" />
  <text x="450" y="170" class="title">contacts</text>
  <text x="450" y="205" class="field">id PK</text>
  <text x="450" y="230" class="field">nama</text>
  <text x="450" y="255" class="field">email</text>
  <text x="450" y="280" class="field">pesan</text>

  <line x1="350" y1="120" x2="430" y2="210" class="line" />
  <text x="360" y="105" class="label">1:n</text>
</svg>
